name: OCI A1 launch retry

# 한 번 실행되면 약 5시간 동안 1분마다 시도하고,
# 실패하면 스스로 다음 실행을 시작한다(예약 실행에 의존하지 않음).
on:
  schedule:
    - cron: "0 */6 * * *"   # 혹시 체인이 끊겼을 때를 위한 예비 실행
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write     # 성공 시 이슈 생성 → 이메일 알림
  actions: write    # 다음 실행 시작 / 성공 시 워크플로 비활성화

concurrency:
  group: oci-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install oci

      - id: launch
        name: Try to launch instance (loop)
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          INSTANCE_NAME: free-a1
          OCPUS: "2"
          MEMORY_GB: "12"
          BOOT_GB: "100"
          ATTEMPTS: "280"   # 약 5시간
          INTERVAL: "60"    # 초
        run: |
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "=== attempt $i/$ATTEMPTS $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="
            : > result.txt
            GITHUB_OUTPUT=result.txt python launch.py || exit 1
            r=$(grep '^result=' result.txt | cut -d= -f2)
            if [ "$r" != "capacity" ]; then
              cat result.txt >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$INTERVAL"
          done
          echo "result=capacity" >> "$GITHUB_OUTPUT"

      - name: Notify via issue
        if: steps.launch.outputs.result == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "OCI A1 인스턴스 생성 성공" \
            --body "생성됨: ${{ steps.launch.outputs.detail }}. OCI 콘솔에서 공인 IP를 확인하세요. 재시도 워크플로는 자동으로 꺼졌습니다."

      - name: Disable this workflow
        if: steps.launch.outputs.result == 'created' || steps.launch.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}"

      - name: Start next run
        if: steps.launch.outputs.result == 'capacity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}"
